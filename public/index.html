<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Metacritic RSS</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1c1915;
      --muted: #5c564c;
      --line: #e4ddd2;
      --paper: #faf7f2;
      --accent: #8a4b08;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
      background: var(--paper);
      color: var(--ink);
      line-height: 1.5;
    }
    main {
      max-width: 40rem;
      margin: 0 auto;
      padding: 3rem 1.25rem 4rem;
    }
    h1 {
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin: 0 0 0.5rem;
    }
    p { margin: 0 0 1rem; }
    .lede { color: var(--muted); font-size: 1.05rem; }
    ul { list-style: none; padding: 0; margin: 1.5rem 0; }
    li {
      border-top: 1px solid var(--line);
      padding: 0.9rem 0;
    }
    a { color: var(--accent); }
    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.92em;
    }
    footer {
      color: var(--muted);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Metacritic RSS</h1>
    <p class="lede">Self-hosted RSS 2.0 feeds for the Metacritic games and TV listing pages.</p>
    <ul>
      <li><a href="/api/games.xml">Games</a> <code>/api/games.xml</code></li>
      <li><a href="/api/tv.xml">TV shows</a> <code>/api/tv.xml</code></li>
    </ul>
    <footer>
      <p>Feeds are cached for about 30 minutes. The same paths work as <code>/games</code> and <code>/tv</code>.</p>
    </footer>
  </main>
</body>
</html>
